[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bizosint"
version = "0.1.0"
description = "Automated, passive OSINT reconnaissance for businesses"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bizosint = "bizosint.cli:main"

[tool.setuptools.packages.find]
include = ["bizosint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
